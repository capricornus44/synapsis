<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>

    <!-- Synapse Gradient -->
    <linearGradient id="synapseGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow1" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- App Squircle Base -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#bgGrad1)" stroke="#312e81" stroke-width="3"/>

  <!-- Synaptic Connections (S-Shape Path & Nodes) -->
  <g filter="url(#glow1)">
    <!-- Main S-Path -->
    <path d="M 340 160 C 220 130 160 220 256 256 C 352 292 292 382 172 352"
          stroke="url(#synapseGrad1)" stroke-width="14" stroke-linecap="round" fill="none"/>

    <!-- Nodes -->
    <circle cx="340" cy="160" r="22" fill="#38bdf8" />
    <circle cx="340" cy="160" r="12" fill="#ffffff" />

    <circle cx="180" cy="180" r="16" fill="#6366f1" />
    <circle cx="180" cy="180" r="8" fill="#ffffff" />

    <!-- Central Synapse Pulse -->
    <circle cx="256" cy="256" r="26" fill="#818cf8" />
    <circle cx="256" cy="256" r="14" fill="#ffffff" />

    <circle cx="332" cy="332" r="16" fill="#a855f7" />
    <circle cx="332" cy="332" r="8" fill="#ffffff" />

    <circle cx="172" cy="352" r="22" fill="#c084fc" />
    <circle cx="172" cy="352" r="12" fill="#ffffff" />
  </g>
</svg>
